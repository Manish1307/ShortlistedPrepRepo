<!doctype html>
<meta charset="utf-8">
<title>ShortlistPrep introduction</title>
<style>html,body{margin:0;background:#1b1740}canvas{display:block}</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// A 45 second animated introduction, drawn on a canvas. record.js records it to docs/video/shortlistprep-intro.webm.
const W = 1280, H = 720, DURATION = 45;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const NAVY = '#1b1740', ORANGE = '#c2410c', TINT = '#fbf7f2', INK = '#1b1740', MUTED = '#5b5873', GREEN = '#0f8a5f', RED = '#c2410c', LINE = '#e6e1f0';
const SERIF = 'Georgia, "Times New Roman", serif', SANS = '"Segoe UI", Arial, sans-serif';

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = t => 1 - Math.pow(1 - clamp(t), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(s, x, y, size, color, o = {}) { g.font = (o.weight || 400) + ' ' + size + 'px ' + (o.font || SANS); g.fillStyle = color; g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); }
function lines(arr, x, y, size, color, lh, o = {}) { arr.forEach((s, i) => text(s, x, y + i * lh, size, color, o)); }
function card(x, y, w, h, o = {}) { g.save(); g.shadowColor = 'rgba(27,23,64,.16)'; g.shadowBlur = 28; g.shadowOffsetY = 10; rr(x, y, w, h, o.r || 16); g.fillStyle = o.fill || '#fff'; g.fill(); g.restore(); if (o.stroke) { rr(x, y, w, h, o.r || 16); g.strokeStyle = o.stroke; g.lineWidth = 2; g.stroke(); } }
function pill(s, x, y, color, fg = '#fff', size = 22) { g.font = '700 ' + size + 'px ' + SANS; const w = g.measureText(s).width + 30; rr(x, y, w, size + 18, (size + 18) / 2); g.fillStyle = color; g.fill(); text(s, x + 15, y + size + 2, size, fg, { weight: 700 }); return w; }
function fadeIn(t, a, d = 0.5) { return ease(seg(t, a, a + d)); }
function logo(x, y, s = 1) { rr(x, y, 54 * s, 54 * s, 12 * s); g.fillStyle = '#fff'; g.fill(); text('S', x + 27 * s, y + 41 * s, 40 * s, NAVY, { font: SERIF, weight: 700, align: 'center' }); g.beginPath(); g.arc(x + 43 * s, y + 41 * s, 4.5 * s, 0, 7); g.fillStyle = ORANGE; g.fill(); }
function caption(s, t, a, b) { const k = Math.min(fadeIn(t, a, .35), 1 - seg(t, b - .3, b)); if (k <= 0) return; g.globalAlpha = k; g.font = '600 30px ' + SANS; const w = g.measureText(s).width + 56; rr((W - w) / 2, H - 92, w, 58, 29); g.fillStyle = 'rgba(27,23,64,.92)'; g.fill(); text(s, W / 2, H - 53, 30, '#fff', { weight: 600, align: 'center' }); g.globalAlpha = 1; }
function ring(cx, cy, r, p, score) { g.lineWidth = 16; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.strokeStyle = '#e5e7eb'; g.stroke(); g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + p * 2 * Math.PI); g.strokeStyle = score >= 70 ? GREEN : ORANGE; g.lineCap = 'round'; g.stroke(); g.lineCap = 'butt'; text(String(Math.round(score)), cx, cy + 16, 56, INK, { weight: 800, align: 'center' }); text('/ 100', cx, cy + 44, 18, MUTED, { align: 'center' }); }
function bg(color) { g.fillStyle = color; g.fillRect(0, 0, W, H); }

// 1. the problem
function s1(t) {
  bg(NAVY); logo(60, 50);
  text('ShortlistPrep', 128, 90, 30, '#fff', { font: SERIF, weight: 700 });
  const a = fadeIn(t, .3, .7); g.globalAlpha = a;
  lines(['Applying everywhere,', 'but no interview calls?'], 90, 290 + (1 - a) * 30, 74, '#fff', 90, { font: SERIF, weight: 700 }); g.globalAlpha = 1;
  g.globalAlpha = fadeIn(t, 2, .6); text('You are not alone. Most resumes are filtered out by software before a person reads them.', 90, 500, 30, '#cfc9ee'); g.globalAlpha = 1;
  g.globalAlpha = fadeIn(t, 3.6, .6); pill('Let us fix that', 90, 550, ORANGE, '#fff', 28); g.globalAlpha = 1;
}
// 2. free ATS check
function s2(t) {
  bg(TINT); text('1', 70, 110, 60, ORANGE, { font: SERIF, weight: 700 }); text('Free ATS resume check', 130, 110, 52, INK, { font: SERIF, weight: 700 });
  g.globalAlpha = fadeIn(t, .2); text('See your resume the way an employer’s screening software does.', 70, 165, 28, MUTED); g.globalAlpha = 1;
  const drop = ease(seg(t, .4, 1.2));
  card(70, 230 + (1 - drop) * 40, 500, 300, { stroke: ORANGE }); g.globalAlpha = drop;
  g.setLineDash([10, 8]); rr(95, 255 + (1 - drop) * 40, 450, 250, 12); g.strokeStyle = ORANGE; g.lineWidth = 2; g.stroke(); g.setLineDash([]);
  text('Drop your resume here', 320, 375 + (1 - drop) * 40, 32, INK, { weight: 700, align: 'center' }); text('PDF, Word or text', 320, 415 + (1 - drop) * 40, 22, MUTED, { align: 'center' }); g.globalAlpha = 1;
  // the file flies in
  const f = ease(seg(t, 1.6, 2.6)); if (f > 0 && t < 3.2) { g.globalAlpha = 1 - seg(t, 2.8, 3.2); const fx = 760 - f * 440, fy = 150 + f * 220; card(fx, fy, 150, 110, { r: 10 }); text('resume.pdf', fx + 75, fy + 62, 22, INK, { weight: 700, align: 'center' }); g.globalAlpha = 1; }
  // the result
  const r = seg(t, 3.2, 4); if (r > 0) {
    g.globalAlpha = ease(r); card(640, 190, 570, 360);
    const p = ease(seg(t, 3.4, 5.2)) * 0.72; ring(760, 330, 70, p, p * 100);
    text('Your ATS score', 880, 300, 30, INK, { weight: 800 }); text('Good start. 3 fixes to reach 90.', 880, 340, 20, MUTED);
    const items = ['Add numbers to your projects', 'Add the skills jobs ask for', 'Fix the contact details'];
    items.forEach((s, i) => { const k = ease(seg(t, 5.2 + i * .5, 5.9 + i * .5)); g.globalAlpha = k; rr(670, 440 + i * 36 - 22, 12, 12, 6); g.fillStyle = ORANGE; g.fill(); text(s, 696, 440 + i * 36 - 8 + (1 - k) * 10, 22, INK, { weight: 600 }); }); g.globalAlpha = 1;
  }
  pill('Free. No card needed.', 70, 570, GREEN, '#fff', 24);
}
// 3. live jobs
function s3(t) {
  bg('#fff'); text('2', 70, 110, 60, ORANGE, { font: SERIF, weight: 700 }); text('Real jobs, live from career pages', 130, 110, 52, INK, { font: SERIF, weight: 700 });
  const tags = ['100% Genuine', 'Live', 'Trusted']; let x = 70; tags.forEach((s, i) => { g.globalAlpha = fadeIn(t, .3 + i * .35); x += pill('✓ ' + s, x, 150, i === 1 ? ORANGE : NAVY, '#fff', 24) + 14; }); g.globalAlpha = 1;
  const rows = [['Software Engineer', 'Bengaluru · Posted today'], ['Civil Site Engineer', 'Pune · Posted today'], ['Embedded Systems Engineer', 'Hyderabad · Posted yesterday'], ['Data Analyst', 'Mumbai · Posted yesterday']];
  rows.forEach((r, i) => { const k = ease(seg(t, 1.2 + i * .5, 1.9 + i * .5)); g.globalAlpha = k; card(70 + (1 - k) * 80, 235 + i * 88, 700, 74, { r: 12 }); rr(90 + (1 - k) * 80, 252 + i * 88, 40, 40, 8); g.fillStyle = '#eef0ff'; g.fill(); text(r[0], 148 + (1 - k) * 80, 268 + i * 88, 24, INK, { weight: 700 }); text(r[1], 148 + (1 - k) * 80, 294 + i * 88, 19, MUTED); pill('Apply on career site', 560 + (1 - k) * 80, 250 + i * 88, ORANGE, '#fff', 15); });
  g.globalAlpha = 1;
  g.globalAlpha = fadeIn(t, 3, .6); lines(['Every job opens on the', 'employer’s own page.', '', 'No middlemen.', 'No fee to apply.'], 840, 300, 34, INK, 46, { weight: 700, font: SERIF }); g.globalAlpha = 1;
  text('Example jobs shown', 70, 620, 18, MUTED);
}
// 4. live search
function s4(t) {
  bg(TINT); text('3', 70, 110, 60, ORANGE, { font: SERIF, weight: 700 }); text('Live Search (AI Enabled)', 130, 110, 52, INK, { font: SERIF, weight: 700 });
  g.globalAlpha = fadeIn(t, .2); text('It reads your resume, looks across company career sites, and ranks roles by fit.', 70, 165, 28, MUTED); g.globalAlpha = 1;
  const steps = ['Reading your resume', 'Searching career sites', 'Scoring each job'];
  steps.forEach((s, i) => { const k = ease(seg(t, .6 + i * .9, 1.2 + i * .9)); g.globalAlpha = k; card(70, 230 + i * 90, 420, 70, { r: 12 }); const done = t > 2.2 + i * .9; g.beginPath(); g.arc(112, 265 + i * 90, 16, 0, 7); g.fillStyle = done ? GREEN : ORANGE; g.fill(); text(done ? '✓' : '…', 112, 272 + i * 90, 20, '#fff', { weight: 800, align: 'center' }); text(s, 145, 273 + i * 90, 24, INK, { weight: 600 }); }); g.globalAlpha = 1;
  const res = [['Software Engineer', 92], ['Backend Developer', 84], ['QA Engineer', 71]];
  res.forEach((r, i) => { const k = ease(seg(t, 3.4 + i * .6, 4.1 + i * .6)); g.globalAlpha = k; card(560 + (1 - k) * 60, 230 + i * 100, 650, 82, { r: 12 }); text(r[0], 590 + (1 - k) * 60, 280 + i * 100, 26, INK, { weight: 700 }); const v = Math.round(r[1] * ease(seg(t, 3.6 + i * .6, 4.8 + i * .6))); pill('Fit ' + v + '%', 1030 + (1 - k) * 60, 250 + i * 100, r[1] > 80 ? GREEN : ORANGE, '#fff', 22); }); g.globalAlpha = 1;
}
// 5. skill gaps and interview prep
function s5(t) {
  bg('#fff'); text('4', 70, 110, 60, ORANGE, { font: SERIF, weight: 700 }); text('Close the gaps. Ace the interview.', 130, 110, 52, INK, { font: SERIF, weight: 700 });
  card(70, 190, 560, 330); text('Skill gap matrix', 100, 240, 28, INK, { weight: 800 });
  [['Core Java', 1, 'Match'], ['Spring Boot', .08, 'Missing'], ['Unit testing', .08, 'Missing']].forEach((r, i) => { const k = ease(seg(t, .5 + i * .5, 1.5 + i * .5)); text(r[0], 100, 300 + i * 70, 24, INK, { weight: 600 }); text(r[2], 600, 300 + i * 70, 22, r[1] > .5 ? GREEN : RED, { weight: 800, align: 'right' }); rr(100, 315 + i * 70, 500, 14, 7); g.fillStyle = '#eceaf5'; g.fill(); rr(100, 315 + i * 70, Math.max(14, 500 * r[1] * k), 14, 7); g.fillStyle = r[1] > .5 ? GREEN : RED; g.fill(); });
  const m = ease(seg(t, 2.2, 3)); g.globalAlpha = m; card(680, 190, 530, 330);
  text('Mock interview', 710, 240, 28, INK, { weight: 800 });
  rr(710, 262, 470, 88, 12); g.fillStyle = '#eef0ff'; g.fill(); lines(['“Tell me about yourself.”'], 735, 316, 26, INK, 34, { weight: 600 });
  rr(710, 370, 470, 120, 12); g.fillStyle = '#e8f6ef'; g.fill(); lines(['Practise your answer, get feedback,', 'and improve it from your own resume.'], 735, 415, 23, INK, 34); g.globalAlpha = 1;
}
// 6. join free
function s6(t) {
  bg(NAVY); const a = fadeIn(t, .2, .7);
  g.globalAlpha = a; logo(W / 2 - 27, 100); lines(['Become a free member today'], W / 2, 270, 66, '#fff', 80, { font: SERIF, weight: 700, align: 'center' });
  text('Free ATS check · Live jobs · Live Search', W / 2, 335, 30, '#cfc9ee', { align: 'center' }); g.globalAlpha = 1;
  g.globalAlpha = fadeIn(t, 1.2, .6); g.font = '800 44px ' + SANS; const w = g.measureText('shortlistprep.com').width + 90; rr((W - w) / 2, 400, w, 90, 45); g.fillStyle = ORANGE; g.fill(); text('shortlistprep.com', W / 2, 460, 44, '#fff', { weight: 800, align: 'center' }); g.globalAlpha = 1;
  g.globalAlpha = fadeIn(t, 2.2, .6); text('No card needed. No auto-renewal. Free to join.', W / 2, 560, 28, '#cfc9ee', { align: 'center' }); g.globalAlpha = 1;
}

const scenes = [
  { a: 0, b: 6, f: s1, cap: 'Applying everywhere but no interview calls?' },
  { a: 6, b: 15, f: s2, cap: 'Check your resume the way an employer’s ATS does' },
  { a: 15, b: 24, f: s3, cap: 'Real jobs straight from company career pages' },
  { a: 24, b: 33, f: s4, cap: 'Live Search ranks jobs by how well you fit' },
  { a: 33, b: 40, f: s5, cap: 'See the skills you are missing, practise the interview' },
  { a: 40, b: DURATION, f: s6, cap: 'Join free today' }
];
function draw(t) {
  const sc = scenes.find(s => t >= s.a && t < s.b) || scenes[scenes.length - 1];
  const lt = t - sc.a; sc.f(lt);
  const fade = Math.min(seg(lt, 0, .35), 1 - seg(sc.b - t, 0, 0) ) ; // scene wipe in
  if (lt < .35) { g.globalAlpha = 1 - seg(lt, 0, .35); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  if (sc !== scenes[0] && sc !== scenes[scenes.length - 1]) caption(sc.cap, lt, .4, sc.b - sc.a);
  if (sc === scenes[0] || sc === scenes[5]) { /* no caption: the text is on screen */ }
}

let start = null, rec = null;
function frame(now) {
  if (start === null) start = now;
  const t = (now - start) / 1000; draw(Math.min(t, DURATION - .01));
  if (t < DURATION + .4) requestAnimationFrame(frame); else if (rec && rec.state !== 'inactive') rec.stop();
}
draw(0);
window.startRecording = () => new Promise(res => {
  const stream = cv.captureStream(30);
  rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 6000000 });
  const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => res(new Uint8Array(await new Blob(chunks, { type: 'video/webm' }).arrayBuffer()));
  rec.start(); requestAnimationFrame(frame);
});
</script>
