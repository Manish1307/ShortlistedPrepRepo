<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mock company portal (extension test)</title>
<style>
body{font:15px system-ui,Arial;max-width:760px;margin:20px auto;padding:0 14px;color:#222}
h2{margin:22px 0 8px;font-size:18px} label{display:block;margin:8px 0 2px;font-size:13px;font-weight:600}
input,select,textarea{width:100%;padding:7px;box-sizing:border-box;font:inherit}
.entry{border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0}.row{display:flex;gap:10px}.row>div{flex:1}
button{padding:7px 12px;margin:6px 0} #report{margin-top:26px;padding:12px;border:2px solid #6d28d9;border-radius:10px;font:13px ui-monospace,monospace;white-space:pre-wrap}
.pass{color:#137a4b}.fail{color:#b42318;font-weight:700}
</style></head><body>
<h1 id="title">Careers: Scientist, Doubled Haploid</h1>
<div id="page"></div>
<div id="report">Press "Run test" (or open with ?run=1).</div>
<button id="run">Run test</button>

<template id="tpl-work"><div class="entry" data-entry="work">
  <label>Job Title <input type="text" name="jobTitle"></label>
  <label>Company <input type="text" name="company"></label>
  <label>Location <input type="text" name="location"></label>
  <label><input type="checkbox" name="current" style="width:auto"> I currently work here</label>
  <div class="row"><div><label>From (month) <select name="fm"><option value="">Month</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select></label></div>
  <div><label>From (year) <input type="text" name="fy" placeholder="YYYY"></label></div></div>
  <div class="row"><div><label>To (month) <select name="tm"><option value="">Month</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select></label></div>
  <div><label>To (year) <input type="text" name="ty" placeholder="YYYY"></label></div></div>
  <label>Role Description <textarea name="desc" rows="3"></textarea></label>
</div></template>
<template id="tpl-edu"><div class="entry" data-entry="edu">
  <label>School or University <input type="text" name="school"></label>
  <label>Degree <input type="text" name="degree"></label>
  <label>Field of Study <input type="text" name="field"></label>
  <div class="row"><div><label>From (year) <input type="text" name="efy" placeholder="YYYY"></label></div><div><label>To (year) <input type="text" name="ety" placeholder="YYYY"></label></div></div>
</div></template>

<script src="../filler.js"></script>
<script>
var scenario = new URLSearchParams(location.search).get('s') || 'app';
var page = document.getElementById('page');
var PROFILE = {
  personal: { fullName: 'Priya Sharma', firstName: 'Priya', lastName: 'Sharma', email: 'priya@example.com', phone: '+91 98765 00021', city: 'Hyderabad', country: 'India', linkedin: 'https://linkedin.com/in/priya' },
  work: [
    { company: 'GreenSeed Labs', title: 'Research Scientist', location: 'Hyderabad', startMonth: 3, startYear: 2021, current: true, endMonth: 0, endYear: 0, responsibilities: '- Doubled haploid lines' },
    { company: 'AgriGen Institute', title: 'Research Associate', location: 'Pune', startMonth: 7, startYear: 2018, endMonth: 2, endYear: 2021, current: false, responsibilities: '- Tissue culture' },
    { company: 'Third Co', title: 'Intern', location: 'Delhi', startMonth: 1, startYear: 2017, endMonth: 6, endYear: 2017, current: false, responsibilities: '- Lab work' }],
  education: [
    { school: 'University of Hyderabad', degree: 'M.Sc.', field: 'Plant Biotechnology', startYear: 2016, endYear: 2018 },
    { school: 'Osmania University', degree: 'B.Sc.', field: 'Botany', startYear: 2013, endYear: 2016 }],
  preferences: { noticePeriod: '60 days' }
};
function labelled(text, html) { return '<label>' + text + html + '</label>'; }
function addEntry(tplId, containerId) {
  var c = document.getElementById(containerId), n = c.children.length + 1;
  var node = document.getElementById(tplId).content.cloneNode(true);
  var h = document.createElement('h3'); h.textContent = (tplId === 'tpl-work' ? 'Work Experience ' : 'Education ') + n; h.style.fontSize = '14px';
  c.appendChild(h); c.appendChild(node);
}
if (scenario === 'signup') {
  document.getElementById('title').textContent = 'Create account';
  page.innerHTML = '<h2>Create your account</h2>' + labelled('Email Address', '<input type="email" name="email">') + labelled('First Name', '<input name="fn">') + labelled('Last Name', '<input name="ln">') +
    labelled('Password', '<input type="password" name="pw">') + labelled('Verify New Password', '<input type="password" name="pw2">') + '<button>Create Account</button>';
} else if (scenario === 'login') {
  document.getElementById('title').textContent = 'Sign in';
  page.innerHTML = '<h2>Sign in</h2>' + labelled('Email Address', '<input type="email" name="email">') + labelled('Password', '<input type="password" name="pw">') + '<button>Sign In</button>';
} else {
  page.innerHTML = '<h2>My Information</h2>' + labelled('First Name', '<input name="fn">') + labelled('Last Name', '<input name="ln">') + labelled('Email', '<input type="email" name="email">') +
    labelled('Phone Number', '<input name="phone" maxlength="10">') + labelled('Country', '<select name="country"><option value="">Select</option><option>United States</option><option>India</option><option>Germany</option></select>') +
    labelled('LinkedIn Profile', '<input name="li">') + labelled('Notice Period', '<input name="np">') +
    '<h2>Work Experience</h2><div id="workList"></div><button id="addWork" type="button">Add</button>' +
    '<h2>Education</h2><div id="eduList"></div><button id="addEdu" type="button">Add Education</button>';
  addEntry('tpl-work', 'workList'); addEntry('tpl-edu', 'eduList');
  document.getElementById('addWork').onclick = function () { setTimeout(function () { addEntry('tpl-work', 'workList'); }, 200); };   // rows appear a moment later, like a real portal
  document.getElementById('addEdu').onclick = function () { setTimeout(function () { addEntry('tpl-edu', 'eduList'); }, 200); };
}
function val(sel) { var e = document.querySelector(sel); return e ? (e.type === 'checkbox' ? e.checked : e.value) : undefined; }
async function runTest() {
  var rep = await SPFill.fillPage(document, PROFILE, {});
  var checks = [];
  var eq = function (name, got, want) { checks.push([name, got === want, 'got ' + JSON.stringify(got) + ', want ' + JSON.stringify(want)]); };
  var all = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
  if (scenario === 'signup') {
    eq('page kind', rep.kind, 'signup');
    eq('email', val('[name=email]'), 'priya@example.com'); eq('first name', val('[name=fn]'), 'Priya'); eq('last name', val('[name=ln]'), 'Sharma');
    eq('password left empty', val('[name=pw]'), ''); eq('verify password left empty', val('[name=pw2]'), '');
  } else if (scenario === 'login') {
    eq('page kind', rep.kind, 'login'); eq('email', val('[name=email]'), 'priya@example.com'); eq('password left empty', val('[name=pw]'), '');
  } else {
    eq('page kind', rep.kind, 'application');
    eq('first name', val('[name=fn]'), 'Priya'); eq('email', val('[name=email]'), 'priya@example.com');
    eq('phone fits maxlength 10', val('[name=phone]'), '9876500021'); eq('country select', val('[name=country]'), 'India'); eq('notice', val('[name=np]'), '60 days');
    eq('3 work rows exist', all('[data-entry=work]').length, 3); eq('2 education rows exist', all('[data-entry=edu]').length, 2);
    var w = all('[data-entry=work]'), e = all('[data-entry=edu]');
    var f = function (box, n) { return box.querySelector('[name=' + n + ']'); };
    eq('job 1 company', f(w[0], 'company').value, 'GreenSeed Labs'); eq('job 1 title', f(w[0], 'jobTitle').value, 'Research Scientist');
    eq('job 1 current ticked', f(w[0], 'current').checked, true); eq('job 1 from month', f(w[0], 'fm').value, 'March'); eq('job 1 from year', f(w[0], 'fy').value, '2021');
    eq('job 1 end year empty', f(w[0], 'ty').value, '');
    eq('job 2 company', f(w[1], 'company').value, 'AgriGen Institute'); eq('job 2 from month', f(w[1], 'fm').value, 'July'); eq('job 2 to month', f(w[1], 'tm').value, 'February'); eq('job 2 to year', f(w[1], 'ty').value, '2021');
    eq('job 2 description', f(w[1], 'desc').value, '- Tissue culture');
    eq('job 3 company', f(w[2], 'company').value, 'Third Co'); eq('job 3 to year', f(w[2], 'ty').value, '2017');
    eq('edu 1 school', f(e[0], 'school').value, 'University of Hyderabad'); eq('edu 1 from', f(e[0], 'efy').value, '2016'); eq('edu 1 to', f(e[0], 'ety').value, '2018');
    eq('edu 2 school', f(e[1], 'school').value, 'Osmania University'); eq('edu 2 field', f(e[1], 'field').value, 'Botany');
  }
  var failed = checks.filter(function (c) { return !c[1]; }).length;
  var out = (failed ? 'FAIL: ' + failed + ' of ' + checks.length : 'PASS: all ' + checks.length) + ' checks\nfilled ' + rep.filled + ', added rows ' + JSON.stringify(rep.added) + '\n' +
    checks.map(function (c) { return (c[1] ? '  ok   ' : '  FAIL ') + c[0] + (c[1] ? '' : '  (' + c[2] + ')'); }).join('\n');
  document.getElementById('report').textContent = out;
  document.getElementById('report').className = failed ? 'fail' : 'pass';
  window.__sp = { failed: failed, total: checks.length, report: out };
}
document.getElementById('run').onclick = runTest;
if (new URLSearchParams(location.search).get('run')) runTest();
</script></body></html>
