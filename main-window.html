<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Teaching Content</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #ffffff;
      color: #1a1a1a;
    }
    h1 { font-size: 28px; }
    .hint {
      margin-top: 24px;
      padding: 16px;
      background: #f2f4f7;
      border-radius: 8px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }
    kbd {
      background: #e6e6e6;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>📘 Example: Quadratic Equations</h1>
  <p>This is the window you share on Zoom/Teams/Meet — put your slides, code editor,
     browser, whatever the class needs to see, here.</p>

  <div class="hint">
    Your private notes window floats on top of your screen but will <strong>not</strong>
    appear in the shared feed. Toggle it with <kbd>Ctrl/Cmd+Shift+N</kbd>.
  </div>
</body>
</html>
