<!doctype html>
<!-- LinkedIn company cover image, 1128x191. The page logo covers the left ~280px, so the text starts at 340px. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block">
<style>
  html, body { margin: 0; width: 1128px; height: 191px; overflow: hidden; }
  .b { position: relative; width: 1128px; height: 191px; font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
       background: radial-gradient(520px 260px at 92% 0%, #e2d2ff 0%, transparent 70%), radial-gradient(460px 240px at 30% 120%, #d5f1ff 0%, transparent 70%), #fbf9ff; overflow: hidden; }
  .wrap { position: absolute; left: 340px; right: 40px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .line1 { font-size: 15px; font-weight: 700; color: #6720cc; letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .line1 i { width: 13px; height: 13px; display: inline-block; background: linear-gradient(135deg, #00c4cc, #7d2ae8); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  h1 { margin: 8px 0 0; white-space: nowrap; font-size: 37px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; color: #0e1318; }
  h1 span { color: #7d2ae8; }
  .sub { margin-top: 10px; white-space: nowrap; font-size: 17px; font-weight: 500; color: #4b5361; }
  .chips { display: grid; grid-template-columns: auto auto; gap: 9px; flex: none; }
  .chip { background: #fff; border: 1px solid #e7e1f5; border-radius: 999px; padding: 8px 15px; font-size: 14.5px; font-weight: 700; color: #0e1318; box-shadow: 0 6px 16px -10px rgba(125,42,232,.45); white-space: nowrap; }
  .chip:first-child { background: #7d2ae8; border-color: #7d2ae8; color: #fff; }
  .url { position: absolute; right: 40px; bottom: 18px; font-size: 14px; font-weight: 800; color: #6720cc; background: #fff; border: 1px solid #e7e1f5; border-radius: 999px; padding: 7px 15px; box-shadow: 0 8px 20px -12px rgba(125,42,232,.5); }
</style></head>
<body><div class="b">
  <div class="wrap">
    <div>
      <div class="line1"><i></i>AI interview coach</div>
      <h1>Practice Today. Get <span>Hired</span> Tomorrow.</h1>
      <div class="sub">Mock interviews · Resume analyzer · Cover letters · Question bank</div>
    </div>
    
  </div>
  <div class="url">shortlistprep.com</div>
</div></body></html>
