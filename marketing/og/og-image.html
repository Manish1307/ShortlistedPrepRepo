<!doctype html>
<!-- The share image (1200 × 630) shown when shortlistprep.com is shared on WhatsApp, LinkedIn, X or Facebook.
     Make the PNG with:  msedge --headless --screenshot=website/assets/og-image.png --window-size=1200,630 marketing/og/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=block');
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Public Sans", "Segoe UI", sans-serif; color: #fff; background: #0f2742; padding: 64px 72px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font: 600 30px "Source Serif 4", Georgia, serif; margin-bottom: 38px; }
  .logo { width: 52px; height: 52px; border-radius: 10px; background: #fff; color: #0f2742; display: grid; place-items: center; font: 600 36px/1 "Source Serif 4", Georgia, serif; position: relative; }
  .logo i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #e4570f; right: 9px; bottom: 11px; }
  h1 { font: 600 62px/1.08 "Source Serif 4", Georgia, serif; letter-spacing: -.02em; margin-bottom: 24px; }
  p { font-size: 24px; color: #bfcde0; line-height: 1.5; max-width: 30ch; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .tags span { border: 1px solid #4a6585; border-radius: 6px; padding: 8px 14px; font-size: 18px; font-weight: 500; color: #e6edf6; }
  .card { background: #fff; color: #0f2742; border-radius: 10px; padding: 26px 28px; }
  .card h3 { font: 600 22px "Source Serif 4", Georgia, serif; margin-bottom: 8px; padding-bottom: 12px; border-bottom: 1px solid #dce3ec; }
  .row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e6ecf3; padding: 14px 2px; font-size: 20px; font-weight: 500; }
  .row em { font-style: normal; font-size: 18px; font-weight: 600; }
  .ok { color: #12805c; } .pt { color: #9a6700; } .no { color: #b42318; }
  .score { margin-top: 18px; font-size: 19px; color: #44546a; } .score b { font: 600 30px "Source Serif 4", Georgia, serif; color: #0f2742; }
</style>
</head>
<body>
  <div>
    <div class="brand"><span class="logo">S<i></i></span>ShortlistPrep</div>
    <h1>Find out why you are not getting interview calls.</h1>
    <p>ATS resume check, skill gaps for real jobs, and interview practice.</p>
    <div class="tags"><span>Free to start</span><span>Built for India</span><span>Real company jobs</span></div>
  </div>
  <div class="card">
    <h3>Skill Gap Matrix</h3>
    <div class="row">C# / .NET <em class="ok">Match</em></div>
    <div class="row">REST APIs <em class="ok">Match</em></div>
    <div class="row">Docker <em class="pt">Partial</em></div>
    <div class="row">Kubernetes <em class="no">Missing</em></div>
    <div class="score">Weighted skill score <b>68</b> / 100</div>
  </div>
</body>
</html>
