<!-- title: Sign in | description: Sign in to your account (demo page: accounts are not connected yet). -->
<section class="auth">
  <div class="wrap">
    <div class="card auth-card">
      <h1 style="font-size:32px">Welcome back</h1>
      <p class="muted">Sign in to continue practising.</p>
      <div class="note">Demo page. Accounts are not connected yet, so nothing you type here is sent or saved.</div>
      <form class="stack demo-form" data-demo-message="This is a design preview, so sign-in is not connected yet. Nothing was sent." style="margin-top:18px">
        <label>Email<input type="email" name="email" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="demo-result" role="status" aria-live="polite"></p>
      </form>
      <p class="muted small">New here? <a href="signup.html">Get early access</a></p>
    </div>
  </div>
</section>
