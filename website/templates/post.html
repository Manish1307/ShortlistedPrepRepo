<article class="post">
  <div class="wrap narrow">
    <a class="muted small" href="blog.html">← All articles</a>
    <h1>{{postTitle}}</h1>
    <p class="muted">{{postDate}} · {{postRead}} min read {{sampleTag}}</p>
    <p class="lead">{{postSummary}}</p>
    <div class="post-body">
{{postBody}}
    </div>
    <div class="band" style="margin-top:48px">
      <h2>Try {{name}} in your next class</h2>
      <p>A private helper that listens to your class and shows an answer, one clear line at a time.</p>
      <a class="btn btn-primary" href="signup.html">Start your free {{trialDays}}-day trial</a>
    </div>
  </div>
</article>
