<article class="post">
  <div class="wrap narrow">
    <a class="muted small" href="blog.html">← All articles</a>
    <h1>{{postTitle}}</h1>
    <p class="muted">{{postDate}} · {{postRead}} min read {{sampleTag}}</p>
    <p class="lead">{{postSummary}}</p>
    <div class="post-body">
{{postBody}}
    </div>
    <div class="band" style="margin-top:52px">
      <h2>Practise it out loud</h2>
      <p>Get kind, clear feedback on every answer with {{name}}.</p>
      <a class="btn btn-lg" href="signup.html">Get early access</a>
    </div>
  </div>
</article>
